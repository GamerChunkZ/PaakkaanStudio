<head>

    <link rel="stylesheet" href="Style/site.css">
    <style>
        /* Wiki Page Styling */
        .wiki-header-container {
            text-align: center;
            margin-bottom: 40px;
        }

        .wiki-title {
            font-family: 'Oswald', sans-serif;
            font-size: 36pt;
            font-weight: 700;
            color: white;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .wiki-subtitle {
            font-size: 13pt;
            color: var(--text-muted);
            font-weight: 300;
            max-width: 600px;
            margin: 0 auto;
        }

        .wiki-search-box {
            max-width: 500px;
            margin: 30px auto 0;
            position: relative;
        }

        .wiki-search-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 14px 25px 14px 50px;
            color: white;
            font-family: 'Outfit', sans-serif;
            font-size: 11pt;
            transition: all 0.3s ease;
        }

        .wiki-search-input:focus {
            outline: none;
            border-color: var(--primary-orange);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 15px rgba(234, 97, 19, 0.25);
        }

        .search-icon-svg {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            width: 18px;
            height: 18px;
        }

        /* Tabs layout */
        .wiki-tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }

        .wiki-tab-btn {
            background: rgba(30, 15, 5, 0.25);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            padding: 12px 28px;
            border-radius: 30px;
            font-family: 'Oswald', sans-serif;
            font-size: 12pt;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .wiki-tab-btn:hover {
            color: var(--primary-yellow);
            border-color: rgba(251, 185, 49, 0.5);
            background: rgba(234, 97, 19, 0.05);
        }

        .wiki-tab-btn.active {
            background: var(--primary-orange);
            color: white;
            border-color: var(--primary-orange);
            box-shadow: 0 5px 15px rgba(234, 97, 19, 0.3);
        }

        /* Content panels */
        .wiki-panels {
            position: relative;
        }

        .wiki-panel {
            display: none;
            animation: fade-in 0.5s ease;
        }

        .wiki-panel.active {
            display: block;
        }

        @keyframes fade-in {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Accordion items */
        .accordion-item {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            margin-bottom: 15px;
            overflow: hidden;
            transition: border-color 0.3s ease;
        }

        .accordion-item:hover {
            border-color: rgba(234, 97, 19, 0.4);
        }

        .accordion-header {
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .accordion-header h3 {
            font-family: 'Outfit', sans-serif;
            font-size: 13pt;
            font-weight: 600;
            color: white;
            margin: 0;
        }

        .accordion-icon {
            color: var(--primary-yellow);
            transition: transform 0.3s ease;
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .accordion-item.open .accordion-icon {
            transform: rotate(180deg);
        }

        .accordion-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            background: rgba(0, 0, 0, 0.2);
        }

        .accordion-content {
            padding: 20px 25px;
            font-size: 11pt;
            color: var(--text-muted);
            line-height: 1.6;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .accordion-content ol,
        .accordion-content ul {
            padding-left: 20px;
            margin: 10px 0;
        }

        .accordion-content li {
            margin-bottom: 6px;
        }

        .accordion-content code {
            background: rgba(234, 97, 19, 0.15);
            color: var(--primary-yellow);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10pt;
        }

        .wiki-link {
            color: var(--primary-yellow);
            text-decoration: underline;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .wiki-link:hover {
            color: white;
        }

        /* Back to top btn / footer info */
        .wiki-footer-actions {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }

        .wiki-action-btn {
            display: inline-block;
            padding: 12px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 11pt;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .btn-outline {
            border: 1px solid var(--glass-border);
            color: var(--text-light);
            background: rgba(255, 255, 255, 0.02);
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .wiki-title {
                font-size: 26pt;
            }

            .wiki-subtitle {
                font-size: 11pt;
            }

            .wiki-tab-btn {
                padding: 10px 20px;
                font-size: 10.5pt;
            }

            .accordion-header {
                padding: 15px;
            }

            .accordion-header h3 {
                font-size: 11pt;
            }

            .accordion-content {
                padding: 15px;
                font-size: 10pt;
            }
        }
    </style>

    <style>
        /* Modern Wiki Layout */
        .wiki-layout-container {
            display: flex;
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 120px 20px 60px;
            min-height: calc(100vh - 120px);

        .wiki-sidebar-nav {

            flex-shrink: 0;

            font-size: 10pt;

        .sidebar-search-input:focus {
            outline: none;
            border-color: var(--primary-orange);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 10px rgba(234, 97, 19, 0.2);

        .sidebar-search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            width: 16px;
            height: 16px;
        }

        .wiki-menu-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow-y: auto;
            max-height: 400px;
            padding-right: 5px;
        }

        /* Custom Scrollbar for Sidebar Menu */
        .wiki-menu-list::-webkit-scrollbar {
            width: 4px;
        }

        .wiki-menu-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 2px;
        }

        .wiki-menu-list::-webkit-scrollbar-thumb {
            background: rgba(234, 97, 19, 0.3);
            border-radius: 2px;
        }

        .wiki-menu-list li {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            font-family: 'Outfit', sans-serif;
            font-size: 11pt;
            font-weight: 500;
            text-align: left;
        }

        .wiki-menu-list li::before {
            content: "•";
            color: var(--primary-yellow);
            font-size: 14pt;
            line-height: 1;
        }

        .wiki-menu-link {
            color: white;
            text-decoration: underline;
            text-underline-offset: 4px;
            text-decoration-color: rgba(255, 255, 255, 0.25);
            transition: all 0.3s ease;
            cursor: pointer;
            word-break: break-word;
        }

        .wiki-menu-link:hover {
            color: var(--primary-yellow);
            text-decoration-color: var(--primary-yellow);
            text-shadow: 0 0 8px rgba(251, 185, 49, 0.3);
        }

        .wiki-menu-list li.active-link .wiki-menu-link {
            color: var(--primary-yellow);
            text-decoration-color: var(--primary-yellow);
            font-weight: 600;
        }

        .back-to-home-btn {
            margin-top: 10px;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-family: 'Oswald', sans-serif;
            font-size: 10pt;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
        }

        /* Middle Article Panel */
        .wiki-content-main {
            flex-grow: 1;
            padding: 40px;
            min-height: 500px;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .wiki-article-header {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 20px;
            margin-bottom: 30px;
            text-align: left;
        }

        .wiki-article-title {
            font-family: 'Oswald', sans-serif;
            font-size: 32pt;
            font-weight: 700;
            color: white;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0 0 12px 0;
            line-height: 1.15;
        }

        .wiki-article-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 9pt;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .meta-folder-icon {
            color: var(--primary-orange);
            font-size: 11pt;
            display: inline-block;
            vertical-align: middle;
            margin-right: 4px;
        }

        .wiki-article-body {
            font-family: 'Outfit', sans-serif;
            font-size: 12pt;
            line-height: 1.7;
            color: var(--text-muted);
            text-align: left;
        }

        .wiki-article-body p {
            margin-bottom: 20px;
        }

        .wiki-article-body img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            margin: 15px 0 25px;
            display: block;
        }

        .wiki-article-body h3 {
            font-family: 'Oswald', sans-serif;
            font-size: 18pt;
            font-weight: 600;
            color: white;
            margin-top: 35px;
            margin-bottom: 15px;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
            padding-bottom: 6px;
            text-transform: uppercase;
        }

        .wiki-article-body ol,
        .wiki-article-body ul {
            padding-left: 24px;
            margin-bottom: 20px;
        }

        .wiki-article-body li {
            margin-bottom: 10px;
        }

        .wiki-article-body code {
            background: rgba(234, 97, 19, 0.12);
            color: var(--primary-yellow);
            padding: 3px 8px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 10.5pt;
            border: 1px solid rgba(234, 97, 19, 0.2);
        }

        .wiki-article-body strong {
            color: white;
        }

        .wiki-link {
            color: var(--primary-yellow);
            text-decoration: underline;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .wiki-link:hover {
            color: white;
        }

        .mobile-back-btn {
            display: none;
            margin-bottom: 25px;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            font-family: 'Oswald', sans-serif;
            font-size: 9.5pt;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .mobile-back-btn:hover {
            background: rgba(234, 97, 19, 0.1);
            border-color: var(--primary-orange);
        }



        @media (max-width: 768px) {
            .wiki-layout-container {
                flex-direction: column;
                padding: 95px 15px 40px;
                gap: 20px;
            }

            .wiki-sidebar-nav {
                width: 100%;
                position: static;
                max-height: none;
                padding: 20px;
            }

            .wiki-content-main {
                width: 100%;
                padding: 25px;
            }

            .wiki-article-title {
                font-size: 24pt;
            }

            /* Toggle visibility on mobile using classes */
            .wiki-layout-container.article-active .wiki-sidebar-nav {
                display: none;
            }

            .wiki-layout-container.article-active .wiki-content-main {
                display: block;
            }

            .wiki-layout-container.article-active .mobile-back-btn {
                display: flex;
            }

            .wiki-layout-container:not(.article-active) .wiki-sidebar-nav {
                display: flex;
            }

            .wiki-layout-container:not(.article-active) .wiki-content-main {
                display: none;
            }
        }
    </style>
</head>

        // Article content database
        const articles = {
            "add-skin": {
                title: "How to Add a Skin",
                category: "tutorials",
                content: `
                    <p>Follow these simple steps to add a custom skin to your bus or traffic vehicle.</p>
                    <ol>
                        <li>
                            <strong>Open the Customization Menu</strong>
                            <p>Launch the game and go to Customization.</p>
                            <img src="Images/skin_step1.jpg" alt="Open the Customization Menu">

                        <li>
                            <strong>Select the Category</strong>

                            <p>To add a skin to traffic vehicles, select <strong>Traffic</strong>.</p>
                            <img src="Images/skin_step2_traffic.jpg" alt="Select Traffic for traffic skin">
                        </li>
                        <li>
                            <strong>Choose the Vehicle</strong>
                            <p>Select the bus or traffic vehicle you want to apply the skin to.</p>
                            <img src="Images/skin_step3_player.jpg" alt="Choose Player bus vehicle">
                            <img src="Images/skin_step3_traffic.jpg" alt="Choose Traffic vehicle">
                        </li>
                        <li>
                            <strong>Add the Skin</strong>
                            <p>Click the <strong>Add Skin</strong> button.<br/>
                            Only <strong>PNG</strong> files are supported.</p>
                            <img src="Images/skin_step4_add.jpg" alt="Click Add Skin button">
                            <p>Select your skin file.</p>
                            <img src="Images/skin_step4_select.jpg" alt="Select your skin file from file picker">

                        <li>
                            <strong>Apply the Skin</strong>

                title: "How to Add a Mod",
                category: "tutorials",
                content: `
                    <p>Follow these steps to add a custom bus mod to the game.</p>
                    <ol>
                        <li>
                            <strong>Open the Customization Menu</strong>
                            <p>Launch the game and go to Customization.</p>
                            <img src="Images/mod_step1.jpg" alt="Open the Customization Menu">
                        </li>
                        <li>
                            <strong>Select the Category</strong>
                            <p>To add a mod for your own vehicle, select <strong>Player</strong>.</p>
                            <img src="Images/mod_step2_player.jpg" alt="Select Player for vehicle mod">
                            <p>To add a mod for traffic vehicles, select <strong>Traffic</strong>.</p>
                            <img src="Images/mod_step2_traffic.jpg" alt="Select Traffic for traffic mod">
                        </li>
                        <li>
                            <strong>Add the Mod</strong>
                            <p>Click <strong>Add New Mod</strong>.</p>
                            <img src="Images/mod_step3_add.jpg" alt="Click Add New Mod button">
                            <p>Select the mod file you want to import.</p>
                            <img src="Images/mod_step3_select.jpg" alt="Select the mod file to import">
                            <p>Once the import is complete, close the Customization menu.</p>
                        </li>
                        <li>
                            <strong>For Player Vehicles</strong>
                            <p>Go to the <strong>Garage</strong>.</p>
                            <img src="Images/mod_step4_garage.jpg" alt="Go to the Garage">
                            <p>Tap <strong>Next</strong> until you find your imported vehicle.</p>
                            <img src="Images/mod_step4_next.jpg" alt="Tap Next arrow button to find imported vehicle">
                            <p>Click the <strong>Rent</strong> button (located below the vehicle) to use it.</p>
                            <img src="Images/mod_step4_rent.jpg" alt="Click Rent button below the vehicle to use it">
                        </li>
                        <li>

        // Load specific article by ID
        function loadArticle(id) {
            const article = articles[id];
            if (!article) return;

            // Generate content
            const contentDiv = document.getElementById('wiki-article-content');
            contentDiv.innerHTML = `
                <div class="wiki-article-header">
                    <h1 class="wiki-article-title">${article.title}</h1>
                    <div class="wiki-article-meta">
                        <span class="meta-folder-icon">📂</span>
                        <span>WIKI · ${article.category}</span>
                    </div>
                </div>
                <div class="wiki-article-body">
                    ${article.content}
                </div>
            `;

            // Update active sidebar link
            document.querySelectorAll('#wiki-links-list li').forEach(li => {
                li.classList.remove('active-link');
            });
            const activeLi = document.getElementById(`li-${id}`);
            if (activeLi) {
                activeLi.classList.add('active-link');
            }

            // Sync hash without triggering popstate
            if (window.location.hash !== `#${id}`) {
                history.replaceState(null, null, `#${id}`);
            }

            // On mobile, set main container as active article view
            const container = document.getElementById('wiki-container');
            container.classList.add('article-active');

            // Scroll article window to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Mobile back button helper
        function backToMenu() {
            const container = document.getElementById('wiki-container');
            container.classList.remove('article-active');
        }

        // Real-time sidebar search
        function handleWikiSearch() {
            const query = document.getElementById('wiki-search').value.toLowerCase();
            const listItems = document.querySelectorAll('#wiki-links-list li');

            listItems.forEach(li => {
                const text = li.innerText.toLowerCase();
                if (text.includes(query)) {
                    li.style.display = 'flex';
                } else {
                    li.style.display = 'none';
                }
            });
        }

        // Initialize page state
        window.addEventListener('DOMContentLoaded', () => {
            // Read URL hash
            const hash = window.location.hash.substring(1);
            if (hash && articles[hash]) {
                loadArticle(hash);
            } else {
                loadArticle('add-skin');
            }
        });

        // Listen for history hash changes
        window.addEventListener('hashchange', () => {
            const hash = window.location.hash.substring(1);
            if (hash && articles[hash]) {
                loadArticle(hash);
            }
        });
    </script>
